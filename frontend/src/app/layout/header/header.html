<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-6 py-4">
    <a
      routerLink="/accueil"
      class="text-2xl font-bold tracking-tight text-emerald-700 focus-visible:outline-2 focus-visible:outline-emerald-600"
    >
      SmartAgri
    </a>

    <div class="flex flex-wrap items-center gap-4">
      @if (pret()) {
        @if (authService.estConnecte()) {
          <span class="text-sm text-slate-600">
            Bonjour,
            <strong class="font-semibold text-slate-900">
              {{ authService.obtenirNomUtilisateur() }}
            </strong>
          </span>

          <button
            type="button"
            (click)="deconnecter()"
            class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
          >
            Déconnexion
          </button>
        } @else {
          <button
            type="button"
            (click)="connecter()"
            class="rounded-lg bg-emerald-700 px-5 py-2 text-sm font-medium text-white transition hover:bg-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-600"
          >
            Connexion
          </button>
        }
      } @else {
        <span class="text-sm text-slate-500" role="status"> Chargement… </span>
      }
    </div>
  </div>

  @if (erreur()) {
    <p role="alert" class="mx-auto max-w-7xl px-6 pb-3 text-sm text-red-700">
      {{ erreur() }}
    </p>
  }
</header>
