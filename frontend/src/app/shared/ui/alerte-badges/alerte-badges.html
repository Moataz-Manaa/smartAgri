@if (alerte; as a) {
  <div class="flex flex-wrap gap-2 text-xs font-semibold">
    <span
      class="rounded-full px-3 py-1"
      [class]="
        a.niveau === 'CRITIQUE'
          ? 'rounded-full bg-rose-100 px-3 py-1 text-rose-900'
          : 'rounded-full bg-amber-100 px-3 py-1 text-amber-900'
      "
    >
      {{ a.niveau | alerteLibelle }}
    </span>
    <span class="rounded-full bg-slate-100 px-3 py-1 text-slate-700">{{
      a.type | alerteLibelle
    }}</span>
    <span
      [class]="
        a.statut === 'ACTIVE'
          ? 'rounded-full bg-emerald-50 px-3 py-1 text-emerald-800'
          : 'rounded-full bg-slate-100 px-3 py-1 text-slate-600'
      "
    >
      {{ a.statut | alerteLibelle }}
    </span>
    <span class="rounded-full border border-slate-200 px-3 py-1 text-slate-600">{{
      a.lue ? 'Lue par vous' : 'Non lue'
    }}</span>
  </div>
}
