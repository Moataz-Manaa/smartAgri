spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/smartagri
spring.datasource.username=smartagri
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# Paramètres Keycloak
app.keycloak.issuer=http://127.0.0.1:8082/realms/smartagri
app.keycloak.audience=smartagri-api

# Administration des comptes Keycloak
app.keycloak.server-url=http://127.0.0.1:8082
app.keycloak.realm=smartagri
app.keycloak.admin-client-id=smartagri-admin
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Météo OpenWeather : clé uniquement dans l'environnement du backend.
app.meteo.api-key=${OPENWEATHER_API_KEY:}
app.meteo.base-url=https://api.openweathermap.org/data/2.5
app.meteo.connexion-secondes=3
app.meteo.lecture-secondes=5
app.meteo.cache-secondes=900
app.meteo.secours-secondes=7200
app.meteo.attente-apres-echec-secondes=60

# Alertes : règles de suivi initiales, à adapter au contexte agricole.
app.alertes.planification-active=true
app.alertes.intervalle-ms=1800000
app.alertes.delai-initial-ms=60000
app.alertes.horizon-heures=24
app.alertes.donnees-max-secondes=900
app.alertes.chaleur-celsius=35
app.alertes.chaleur-critique-celsius=40
app.alertes.gel-celsius=0
app.alertes.gel-critique-celsius=-3
app.alertes.pluie-trois-heures-mm=20
app.alertes.pluie-critique-trois-heures-mm=40
