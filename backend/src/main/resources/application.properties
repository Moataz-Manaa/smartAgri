spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/smartagri
spring.datasource.username=smartagri
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081

# Paramètres Keycloak
app.keycloak.issuer=http://127.0.0.1:8082/realms/smartagri
app.keycloak.audience=smartagri-api

# Administration des comptes Keycloak
app.keycloak.server-url=http://127.0.0.1:8082
app.keycloak.realm=smartagri
app.keycloak.admin-client-id=smartagri-admin
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}